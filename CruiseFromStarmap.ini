; Cruise From Starmap 0.1.0
;
; Highlight a planet or moon in the CURRENT system map and use SET CRUISE TARGET.
; Tap/release to remember the body and return to the cockpit. Complete the
; Starmap hold fill to enter vanilla Cruise immediately and lock that body;
; the key may be released once the fill completes.
;
; Put personal changes in CruiseFromStarmapCustom.ini beside this file. The
; custom file wins and is not replaced by updates.

[General]
; TapHoldCruise is the supported interaction: tap marks the highlighted body;
; completing the hold starts Cruise and locks it.
sMode=TapHoldCruise

; Optional custom blue marker on the ship HUD. Cruise itself remains vanilla.
bShowMarker=false

; Show the Starmap's localized body name beside the marker.
bShowDestinationName=true

; Persistent cockpit confirmation that does not depend on positional marker data.
bShowTargetStatus=true

; Per-selection, input-transition, course, and lifecycle detail in the SFSE log.
bVerboseLog=true
