; Cruise From Starmap 0.1.0
;
; Highlight a planet or moon in the CURRENT system map and press the existing
; Set Route / Cruise control. MarkOnly is the safe default. Live 1.16.244
; testing proved that a carried keyboard hold does not become a fresh Cruise
; press, so it is suppressed until release and synthetic replay is disabled.
;
; Put personal changes in CruiseFromStarmapCustom.ini beside this file. The
; custom file wins and is not replaced by updates.

[General]
; MarkOnly or HoldToCruise
sMode=MarkOnly

; Runtime marker on the ship HUD. It hides if the HUD has no valid bearing.
bShowMarker=true

; Show the Starmap's localized body name beside the marker.
bShowDestinationName=true

; Per-selection, input-transition, course, and lifecycle detail in the SFSE log.
bVerboseLog=true
